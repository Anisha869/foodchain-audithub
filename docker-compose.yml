services:

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: foodchain-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./server/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: foodchain-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
